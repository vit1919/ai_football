[project]
name = "ai-football-predictor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.2",
    "bcrypt<4",
    "fastapi[standard]>=0.135.1",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pyjwt>=2.12.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.4",
    "slowapi>=0.1.10",
    "soccerdata>=1.9.0",
    "sqlalchemy>=2.0.48",
]
[tool.setuptools]
packages = ["app", "models", "schemas", "services"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

ignore = [
    "E501",  
    "B008",  
    "BLE001", 
    "SIM",    
    "UP",
    "E712",   
]
